<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Avoid stale menu when refreshing during development; use a hard refresh if the start screen looks old. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Marble roll</title>
  <link rel="stylesheet" href="styles.css?v=20260329g">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" tabindex="0"></canvas>
    <div id="ui-root" aria-live="polite">
      <div id="screen-menu" class="screen screen--visible">
        <h1 id="menu-heading"></h1>
        <p class="menu-subtitle" id="menu-subtitle"></p>
        <p class="hint" id="menu-hint"></p>
        <p class="keys" id="menu-keys"></p>
        <div class="menu-actions">
          <label class="dev-mode-label">
            <input type="checkbox" id="dev-mode" />
            Dev mode
          </label>
          <button type="button" id="btn-new-game" class="btn-primary"></button>
        </div>
        <p class="menu-build" title="If this line is missing, the browser or server is not loading this folder’s index.html">
          Build 20260329g — marble player; assets via AssetSettings
        </p>
      </div>
      <div id="screen-marble-dead" class="screen" hidden>
        <h2 id="death-heading"></h2>
        <p class="hint" id="death-hint"></p>
        <button type="button" id="btn-try-again" class="btn-primary"></button>
      </div>
      <div id="screen-level-complete" class="screen" hidden>
        <h2 id="level-complete-title">Level complete</h2>
        <p id="level-complete-msg" class="hint">Press Enter to continue.</p>
        <button type="button" id="btn-continue" class="btn-primary"></button>
      </div>
      <div id="hud" class="hud" hidden>
        <span id="hud-level-name"></span>
      </div>
      <div id="dev-bypass-wrap" class="dev-bypass-wrap" hidden>
        <button type="button" id="btn-dev-skip-level" class="btn-dev">Skip level</button>
      </div>
    </div>
  </div>
  <script type="module" src="main.js?v=20260329g"></script>
</body>
</html>
